nd"/><circle cx="400" cy="720" r="6" fill="#cf222e" stroke="#fff" stroke-width="1.5"/><text x="420" y="725" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="start" font-weight="700">GPIO2</text><text x="352" y="725" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="end" font-weight="400">strapping · leave alone</text><line x1="370" y1="798" x2="400" y2="798" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="400" cy="798" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="420" y="803" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="start" font-weight="700">GPIO1</text><text x="352" y="803" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="end" font-weight="400">free</text><line x1="370" y1="876" x2="400" y2="876" stroke="#0d7a6f" stroke-width="3" stroke-linecap="round"/><circle cx="400" cy="876" r="6" fill="#0d7a6f" stroke="#fff" stroke-width="1.5"/><text x="420" y="881" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="start" font-weight="700">GPIO0</text><text x="352" y="881" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="end" font-weight="400">battery sense · ADC1 ch0</text><line x1="740" y1="330" x2="770" y2="330" stroke="#1a7f37" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="330" r="6" fill="#1a7f37" stroke="#fff" stroke-width="1.5"/><text x="720" y="335" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO5</text><text x="808" y="335" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">servo PWM · 50 Hz</text><line x1="740" y1="408" x2="770" y2="408" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="408" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="720" y="413" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO6</text><text x="808" y="413" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">I2C SDA (future)</text><line x1="740" y1="486" x2="770" y2="486" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="486" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="720" y="491" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO7</text><text x="808" y="491" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">I2C SCL (future)</text><line x1="740" y1="564" x2="770" y2="564" stroke="#bc4c00" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="564" r="6" fill="#bc4c00" stroke="#fff" stroke-width="1.5"/><text x="720" y="569" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO8</text><text x="808" y="569" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">onboard LED · active low</text><line x1="740" y1="642" x2="770" y2="642" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="642" r="6" fill="#cf222e" stroke="#fff" stroke-width="1.5"/><text x="720" y="647" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO9</text><text x="808" y="647" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">BOOT + strapping</text><line x1="740" y1="720" x2="770" y2="720" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="720" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="720" y="725" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO10</text><text x="808" y="725" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">free</text><line x1="740" y1="798" x2="770" y2="798" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="798" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="720" y="803" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO20</text><text x="808" y="803" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">UART0 RX</text><line x1="740" y1="876" x2="770" y2="876" stroke="#57606a" stroke-width="3" stroke-linecap="round"/><circle cx="740" cy="876" r="6" fill="#57606a" stroke="#fff" stroke-width="1.5"/><text x="720" y="881" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#16181d" text-anchor="end" font-weight="700">GPIO21</text><text x="808" y="881" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57606a" text-anchor="start" font-weight="400">UART0 TX</text><text x="40" y="1090" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#57606a" text-anchor="start" font-weight="400">GPIO11-17: internal flash, never use.  GPIO18/19: USB D-/D+.  GPIO2/8/9: strapping.</text><text x="40" y="1118" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#57606a" text-anchor="start" font-weight="400">GPIO4-7 double as JTAG; using them costs hardware debugging, not functionality.</text><text x="40" y="1146" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#57606a" text-anchor="start" font-weight="400">No MCPWM on this chip: the 6 LEDC channels do motor and servo PWM.</text></svg>